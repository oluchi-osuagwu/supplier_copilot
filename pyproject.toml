# pyproject.toml — the single source of truth for how this project is packaged,
# what it depends on, and how its tools (pytest, ruff) are configured.
# Modern Python standard (PEP 517/518/621) that replaces setup.py + requirements.txt.

[build-system]
# The "build backend" is the tool that turns our src/ folder into an installable package.
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supplier-copilot"
version = "0.1.0"
description = "Supplier Insights Copilot: hybrid RAG + text-to-SQL assistant over public retail data."
readme = "README.md"
requires-python = ">=3.11"
# Runtime dependencies: only what the code needs to run. Lower bounds (>=) allow
# bug-fix upgrades while guaranteeing the features we rely on exist.
dependencies = [
    "duckdb>=1.1",         # embedded columnar analytics database (our dev warehouse)
    "pydantic>=2.7",       # typed, validated configuration objects
    "pyyaml>=6.0",         # reads configs/settings.yaml
    "python-dotenv>=1.0",  # loads secrets from .env into environment variables
]

[project.optional-dependencies]
# Dev-only tools, installed with: pip install -e ".[dev]"
dev = [
    "pytest>=8.0",  # test runner
    "ruff>=0.5",    # fast linter/formatter (catches bugs + enforces style)
]

[tool.setuptools.packages.find]
# "src layout": tell setuptools our package lives under src/, not the repo root.
where = ["src"]

[tool.setuptools.package-data]
# Ship non-Python files (our SQL schema) inside the installed package.
supplier_copilot = ["db/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"  # print a short summary of skipped/failed tests at the end

[tool.ruff]
line-length = 100
target-version = "py311"
